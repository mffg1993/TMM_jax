[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "tmm-jax"
version = "0.1.0"
description = "A fast TMM optimizer based on jax"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "jax>=0.4",
    "matplotlib",
    "numpy",
    "scipy",
]

[tool.setuptools]
packages = ["TMM", "materials"]

[tool.setuptools.package-data]
materials = ["*.csv"]